<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<!-- feito para o Galaxy Tab S10 FE: ~1150px deitado, ~720px em pé, só toque -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#5b3fd9">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icone-192.png">
<title>Leads Cygna · Instagram</title>
<style>
  :root {
    --roxo: #5b3fd9; --roxo-esc: #4a31c0; --roxo-claro: #eeeafd; --fundo: #f4f3f9; --texto: #1f1d2b; --cinza: #615e75;
    --borda: #dedbea; --verde: #17834a; --verde-claro: #e2f4ea; --cinza-claro: #efeef4; --toque: 48px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { touch-action: manipulation; }
  body { margin: 0; font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--fundo); color: var(--texto);
         padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* ---------- topo ---------- */
  header { background: #fff; border-bottom: 1px solid var(--borda); position: sticky; top: 0; z-index: 5; }
  .topo { max-width: 1400px; margin: 0 auto; padding: 12px 20px 8px; display: flex; gap: 8px 16px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; color: var(--roxo); white-space: nowrap; }
  .contadores { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  .chip { background: var(--cinza-claro); border-radius: 999px; padding: 4px 12px; font-size: 14px; color: var(--cinza); white-space: nowrap; }
  .chip b { color: var(--texto); }
  .filtros { max-width: 1400px; margin: 0 auto; padding: 0 20px 12px; display: grid; gap: 8px;
             grid-template-columns: minmax(200px, 1.4fr) repeat(4, minmax(150px, 1fr)) auto; }
  .filtros input[type=search], .filtros select { height: var(--toque); border: 1px solid var(--borda); border-radius: 10px; padding: 0 12px; background: #fff; min-width: 0; width: 100%; }
  .filtros input[type=search] { font-size: 16px; }
  .alternar { display: flex; align-items: center; gap: 10px; height: var(--toque); padding: 0 14px; border: 1px solid var(--borda); border-radius: 10px; background: #fff; font-size: 15px; white-space: nowrap; user-select: none; }
  .alternar input { width: 22px; height: 22px; accent-color: var(--roxo); margin: 0; }

  /* ---------- lista ---------- */
  main { max-width: 1400px; margin: 0 auto; padding: 16px 20px 40px; }
  .lista { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); align-items: start; }
  .lead { background: #fff; border: 1px solid var(--borda); border-top: 5px solid var(--borda); border-radius: 14px; padding: 14px 16px 16px;
          display: flex; flex-direction: column; gap: 12px; transition: opacity .15s; }
  .lead.enviada { border-top-color: var(--roxo); }
  .lead.salvando { opacity: .6; }
  .nome { font-weight: 700; font-size: 17px; line-height: 1.3; }
  .meta { color: var(--cinza); font-size: 14px; margin-top: 2px; }
  .handle { color: var(--roxo); font-size: 15px; font-weight: 600; margin-top: 4px; word-break: break-all; }
  .handle.sem { color: var(--cinza); font-weight: 500; }

  .msg { margin: 0; background: var(--cinza-claro); border-radius: 10px; padding: 10px 12px; font-size: 14.5px; line-height: 1.5; }
  .msg span { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .msg.aberta span { display: block; }
  .ver-msg { align-self: flex-start; background: none; border: 0; color: var(--roxo); font-size: 14px; font-weight: 600; padding: 0; min-height: 44px; }

  .acao-principal { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 12px; border: 0;
                    background: var(--roxo); color: #fff; font-size: 16px; font-weight: 700; text-decoration: none; text-align: center; padding: 0 14px; }
  .acao-principal:active { background: var(--roxo-esc); }
  .acao-principal.ok { background: var(--verde); }
  .acao-principal.sec { background: var(--roxo-claro); color: var(--roxo); }
  .acoes-sec { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn-sec { min-height: var(--toque); border-radius: 10px; border: 1px solid var(--borda); background: #fff; font-size: 15px; font-weight: 600; color: var(--texto);
             display: flex; align-items: center; justify-content: center; text-decoration: none; padding: 0 8px; text-align: center; }
  .btn-sec:active { background: var(--cinza-claro); }
  .btn-sec.ok { border-color: var(--verde); color: var(--verde); background: var(--verde-claro); }

  .grupo .rotulo { display: block; font-size: 12px; color: var(--cinza); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; font-weight: 600; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .seg button { min-height: var(--toque); border: 1px solid var(--borda); background: #fff; border-radius: 10px; font-size: 15px; color: var(--cinza); padding: 0 6px; }
  .seg button.on { background: var(--roxo); border-color: var(--roxo); color: #fff; font-weight: 700; }
  .seg button.on.verde { background: var(--verde); border-color: var(--verde); }
  .seg button.on.cinza { background: #6f6c82; border-color: #6f6c82; }
  .seg .extra { grid-column: 1 / -1; background: var(--cinza-claro); border-radius: 8px; padding: 6px 10px; font-size: 13px; color: var(--cinza); }

  .aviso { grid-column: 1 / -1; text-align: center; color: var(--cinza); padding: 48px 0; font-size: 16px; }
  .aviso.erro { color: #b42318; }
  .lista.carregando { opacity: .55; pointer-events: none; }

  .pag { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 22px; color: var(--cinza); font-size: 15px; }
  .pag button { min-height: var(--toque); min-width: 130px; border: 1px solid var(--borda); background: #fff; border-radius: 10px; font-weight: 600; }
  .pag button:disabled { opacity: .4; }

  .toast { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%) translateY(120px);
           background: var(--texto); color: #fff; padding: 12px 20px; border-radius: 12px; font-size: 15px; transition: transform .2s; max-width: 90vw; text-align: center; z-index: 10; }
  .toast.on { transform: translateX(-50%) translateY(0); }

  /* tablet em pé (~720-800px) */
  @media (max-width: 1000px) {
    .filtros { grid-template-columns: 1fr 1fr 1fr; }
    .filtros input[type=search] { grid-column: 1 / -1; }
    .contadores { margin-left: 0; }
  }
  /* celular, só por garantia */
  @media (max-width: 600px) {
    .topo, .filtros, main { padding-left: 12px; padding-right: 12px; }
    .filtros { grid-template-columns: 1fr 1fr; }
    .lista { grid-template-columns: 1fr; }
    header { position: static; }
  }
</style>
</head>
<body>
<header>
  <div class="topo">
    <h1>Leads Cygna · Instagram</h1>
    <div class="contadores" id="contadores"></div>
  </div>
  <div class="filtros">
    <input type="search" id="q" placeholder="Buscar nome, @ ou bairro" aria-label="Buscar" enterkeyhint="search" autocomplete="off">
    <select id="status" aria-label="Status">
      <option value="">Status: todos</option>
      <option>Não contatado</option>
      <option>Mensagem enviada</option>
    </select>
    <select id="obs" aria-label="Observação">
      <option value="">Observação: todas</option>
      <option value="-">Sem observação</option>
      <option>Seguindo</option>
      <option>Não tem insta</option>
    </select>
    <select id="cidade" aria-label="Cidade"><option value="">Cidade: todas</option></select>
    <select id="segmento" aria-label="Segmento"><option value="">Segmento: todos</option></select>
    <label class="alternar"><input type="checkbox" id="ig"> Só com Instagram</label>
  </div>
</header>
<main>
  <div class="lista" id="lista"><div class="aviso">Carregando leads da planilha... (na primeira vez do dia pode levar até 1 minuto)</div></div>
  <div class="pag" id="pag"></div>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FILTROS = ['q', 'status', 'obs', 'cidade', 'segmento', 'ig'];
let pagina = 0, itens = [], opcoesProntas = false, pedido = 0, ultimo = null;
// marcações feitas nesta aba: garantem que a tela não "volte" enquanto o cache do servidor atualiza
const feitas = {};

const valor = id => $(id).type === 'checkbox' ? ($(id).checked ? '1' : '') : $(id).value;
function salvarFiltros() {
  try { localStorage.setItem('filtros', JSON.stringify({ ...Object.fromEntries(FILTROS.map(f => [f, valor(f)])), pagina })); } catch (e) {}
}
function restaurarFiltros() {
  let f = {};
  try { f = JSON.parse(localStorage.getItem('filtros')) || {}; } catch (e) {}
  FILTROS.forEach(id => { if (f[id] !== undefined) { if ($(id).type === 'checkbox') $(id).checked = f[id] === '1'; else $(id).value = f[id]; } });
  pagina = f.pagina || 0;
}

async function carregar() {
  const meu = ++pedido;
  const p = new URLSearchParams(Object.fromEntries(FILTROS.map(f => [f, valor(f)]).filter(([, v]) => v)));
  p.set('pagina', pagina);
  $('lista').classList.add('carregando');
  try {
    const r = await fetch('/api/leads?' + p);
    const d = await r.json();
    if (meu !== pedido) return;
    if (!r.ok) throw new Error(d.erro || r.status);
    if (!opcoesProntas) {
      const preencher = (sel, lista) => {
        lista.forEach(([v, n]) => $(sel).insertAdjacentHTML('beforeend', `<option value="${esc(v)}">${esc(v)} (${n.toLocaleString('pt-BR')})</option>`));
      };
      preencher('cidade', d.opcoes.cidades);
      preencher('segmento', d.opcoes.segmentos);
      opcoesProntas = true;
      restaurarFiltros();
      if (valor('cidade') || valor('segmento')) return carregar();
    }
    pagina = d.pagina;
    itens = d.itens.map(l => ({ ...l, ...feitas[l.id] }));
    ultimo = d;
    render(d);
  } catch (e) {
    $('lista').innerHTML = `<div class="aviso erro">Não foi possível carregar os leads: ${esc(e.message)}</div>`;
  } finally {
    if (meu === pedido) $('lista').classList.remove('carregando');
  }
}

const handle = l => l.ig ? l.ig.replace(/^@/, '') : '';
const linkIg = l => `https://www.instagram.com/${encodeURIComponent(handle(l))}/`;
const linkBusca = l => `https://www.google.com/search?q=${encodeURIComponent(`${l.nome} ${l.cidade} instagram`)}`;

function card(l) {
  const enviada = l.status !== 'Não contatado';
  const outroSt = !['Não contatado', 'Mensagem enviada'].includes(l.status);
  const outraObs = l.obs && !['Seguindo', 'Não tem insta'].includes(l.obs);
  const local = [l.bairro, l.cidade !== l.bairro ? l.cidade : ''].filter(Boolean).join(', ');
  // ação principal: copia a mensagem e já abre o perfil (no tablet abre o app do Instagram)
  const principal = l.ig
    ? `<a class="acao-principal" data-copiar-abrir href="${linkIg(l)}" target="_blank" rel="noopener">Copiar e abrir Instagram</a>`
    : `<a class="acao-principal sec" href="${linkBusca(l)}" target="_blank" rel="noopener">Procurar Instagram no Google</a>`;
  return `<article class="lead ${enviada ? 'enviada' : ''}" data-id="${esc(l.id)}">
    <div>
      <div class="nome">${esc(l.nome)}</div>
      <div class="meta">${esc(l.segmento)}${local ? ' · ' + esc(local) : ''}</div>
      <div class="handle ${l.ig ? '' : 'sem'}">${l.ig ? '@' + esc(handle(l)) : 'Sem Instagram na planilha'}</div>
    </div>
    <div>
      <p class="msg"><span>${esc(l.msg)}</span></p>
      <button class="ver-msg" data-ver>Ver mensagem inteira</button>
    </div>
    ${principal}
    <div class="acoes-sec">
      <button class="btn-sec" data-copiar>Só copiar</button>
      ${l.ig ? `<a class="btn-sec" href="${linkIg(l)}" target="_blank" rel="noopener">Só abrir perfil</a>`
             : `<a class="btn-sec" href="${linkBusca(l)}" target="_blank" rel="noopener">Buscar no Google</a>`}
    </div>
    <div class="grupo"><span class="rotulo">Status</span><div class="seg">
      <button data-status="Não contatado" class="${l.status === 'Não contatado' ? 'on cinza' : ''}">Não contatado</button>
      <button data-status="Mensagem enviada" class="${l.status === 'Mensagem enviada' || outroSt ? 'on' : ''}">Mensagem enviada</button>
      ${outroSt ? `<div class="extra">Na planilha: ${esc(l.status)}</div>` : ''}
    </div></div>
    <div class="grupo"><span class="rotulo">Observação</span><div class="seg">
      <button data-obs="Seguindo" class="${l.obs === 'Seguindo' ? 'on verde' : ''}">Seguindo</button>
      <button data-obs="Não tem insta" class="${l.obs === 'Não tem insta' ? 'on cinza' : ''}">Não tem insta</button>
      ${outraObs ? `<div class="extra">Na planilha: ${esc(l.obs)}</div>` : ''}
    </div></div>
  </article>`;
}

function render(d) {
  $('lista').innerHTML = itens.length ? itens.map(card).join('') : '<div class="aviso">Nenhum lead com esses filtros.</div>';
  // esconde "ver mensagem inteira" quando o texto já cabe
  document.querySelectorAll('.lead .msg span').forEach(t => { if (t.scrollHeight <= t.clientHeight + 2) t.parentElement.nextElementSibling.remove(); });
  $('pag').innerHTML = d.paginas > 1
    ? `<button id="ant" ${d.pagina === 0 ? 'disabled' : ''}>← Anterior</button> Página ${d.pagina + 1} de ${d.paginas} <button id="prox" ${d.pagina >= d.paginas - 1 ? 'disabled' : ''}>Próxima →</button>`
    : '';
  if ($('ant')) $('ant').onclick = () => { pagina--; salvarFiltros(); carregar(); scrollTo(0, 0); };
  if ($('prox')) $('prox').onclick = () => { pagina++; salvarFiltros(); carregar(); scrollTo(0, 0); };
  contadores(d);
}

function contadores(d) {
  const c = d.contadores, n = v => v.toLocaleString('pt-BR');
  $('contadores').innerHTML = `<span class="chip">Na lista: <b>${n(d.total)}</b></span>
    <span class="chip">Enviadas: <b>${n(c.enviadas)}</b></span>
    <span class="chip">Seguindo: <b>${n(c.seguindo)}</b></span>
    <span class="chip">Sem insta: <b>${n(c.semInsta)}</b></span>`;
}

function toast(t) {
  $('toast').textContent = t; $('toast').classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => $('toast').classList.remove('on'), 2400);
}

// aplica no card e nos contadores; devolve o estado anterior para poder desfazer
function aplicar(l, novo) {
  const antes = { status: l.status, obs: l.obs };
  feitas[l.id] = { status: novo.status, obs: novo.obs };
  Object.assign(l, feitas[l.id]);
  if (ultimo) {
    const c = ultimo.contadores, conta = (x, k, v) => (x[k] === v ? 1 : 0);
    c.enviadas += (novo.status !== 'Não contatado') - (antes.status !== 'Não contatado');
    c.seguindo += conta(novo, 'obs', 'Seguindo') - conta(antes, 'obs', 'Seguindo');
    c.semInsta += conta(novo, 'obs', 'Não tem insta') - conta(antes, 'obs', 'Não tem insta');
    contadores(ultimo);
  }
  const art = document.querySelector(`.lead[data-id="${CSS.escape(l.id)}"]`);
  if (art) {
    const aberta = art.querySelector('.msg.aberta');
    art.outerHTML = card(l);
    const novoArt = document.querySelector(`.lead[data-id="${CSS.escape(l.id)}"]`);
    const t = novoArt.querySelector('.msg span');
    if (aberta) { t.parentElement.classList.add('aberta'); novoArt.querySelector('[data-ver]')?.remove(); }
    else if (t.scrollHeight <= t.clientHeight + 2) novoArt.querySelector('[data-ver]')?.remove();
  }
  return antes;
}

// a tela muda na hora; a planilha do Google leva alguns segundos e, se falhar, desfaz
async function marcar(l, campos) {
  const antes = aplicar(l, { status: campos.status ?? l.status, obs: 'obs' in campos ? campos.obs : l.obs });
  try {
    const r = await fetch('/api/marcar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: l.id, ...campos }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.erro || r.status);
    aplicar(l, d);
    toast('Salvo na planilha');
  } catch (e) {
    aplicar(l, antes);
    toast('Não salvou na planilha: ' + e.message);
  }
}

function copiar(texto) {
  // sem await: o toque continua valendo para abrir o Instagram logo em seguida
  if (navigator.clipboard?.writeText) return navigator.clipboard.writeText(texto).catch(() => copiarAntigo(texto));
  copiarAntigo(texto);
  return Promise.resolve();
}
function copiarAntigo(texto) {
  const t = document.createElement('textarea');
  t.value = texto; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
  document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();
}

function avisarCopiado(b, rotulo) {
  b.classList.add('ok'); const txt = b.textContent; b.textContent = rotulo;
  setTimeout(() => { b.classList.remove('ok'); b.textContent = txt; }, 1600);
}

$('lista').addEventListener('click', e => {
  const art = e.target.closest('.lead'); if (!art) return;
  const l = itens.find(x => x.id === art.dataset.id);
  const alvo = e.target.closest('button, a');
  if (!alvo) return;
  if (alvo.hasAttribute('data-ver')) {
    art.querySelector('.msg').classList.add('aberta'); alvo.remove(); return;
  }
  if (alvo.hasAttribute('data-copiar-abrir')) {
    // deixa o link abrir normalmente; só copia antes
    copiar(l.msg);
    avisarCopiado(alvo, 'Copiada! Abrindo Instagram...');
    toast('Mensagem copiada. No Instagram, toque em Mensagem e cole.');
    return;
  }
  if (alvo.hasAttribute('data-copiar')) {
    copiar(l.msg); avisarCopiado(alvo, 'Copiada!'); toast('Mensagem copiada.'); return;
  }
  if (alvo.dataset.status) { if (alvo.dataset.status !== l.status) marcar(l, { status: alvo.dataset.status }); return; }
  if (alvo.dataset.obs) marcar(l, { obs: l.obs === alvo.dataset.obs ? '' : alvo.dataset.obs });
});

let atraso;
FILTROS.forEach(id => $(id).addEventListener(id === 'q' ? 'input' : 'change', () => {
  clearTimeout(atraso);
  atraso = setTimeout(() => { pagina = 0; salvarFiltros(); carregar(); }, id === 'q' ? 400 : 0);
}));
// "pesquisar" do teclado do tablet fecha o teclado
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });

restaurarFiltros();
carregar();
</script>
</body>
</html>
